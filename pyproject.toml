[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scanner"
version = "0.1.0"
description = "Scan GitHub repositories for structural and community-health improvements"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
repo-scanner = "repo_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["repo_scanner*"]
